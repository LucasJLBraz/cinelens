<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cinelens</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1115; --card: #1a1d24; --text: #e8e8ea; --muted: #8a8f9c; --accent: #f5c518; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 system-ui, sans-serif; }
    header { padding: max(16px, env(safe-area-inset-top)) 16px 8px; }
    h1 { margin: 0; font-size: 22px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; padding: 8px 16px; }
    .movie { min-width: 0; }
    .poster { width: 100%; aspect-ratio: 2 / 3; border-radius: 6px; background: var(--card); object-fit: cover; display: block; }
    .title { margin-top: 6px; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .original { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #more { display: block; margin: 16px auto max(24px, env(safe-area-inset-bottom)); padding: 10px 24px; border: 1px solid var(--muted); border-radius: 20px; background: none; color: var(--text); font: inherit; }
    [hidden] { display: none !important; }
    .poster.missing { display: flex; align-items: center; justify-content: center; padding: 8px; text-align: center; font-size: 12px; color: var(--muted); }
    #setup { padding: 32vh 32px 0; text-align: center; }
    #setup p { color: var(--muted); }
    progress { width: 100%; height: 6px; accent-color: var(--accent); }
    #retry { margin-top: 16px; padding: 10px 24px; border: 1px solid var(--muted); border-radius: 20px; background: none; color: var(--text); font: inherit; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pill { padding: 8px 16px; border: 1px solid var(--muted); border-radius: 20px; background: none; color: var(--text); font: inherit; font-size: 13px; }
    #import-result { margin: 0 16px; color: var(--muted); font-size: 13px; }
    .movie { cursor: pointer; }
    #filme { padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
    #filme .top { display: flex; gap: 16px; margin-top: 12px; }
    #filme .poster { width: 120px; flex: none; }
    #filme h1 { font-size: 20px; }
    #filme .original { white-space: normal; margin-top: 4px; }
    #filme .badge { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--accent); }
    #notas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 24px 0 8px; }
    #notas button { padding: 10px 0; border: 1px solid var(--card); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    #notas button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    #acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: flex-start; }
    #acoes .on { border-color: var(--accent); color: var(--accent); }
    .menu { position: relative; }
    .menu summary { list-style: none; cursor: pointer; }
    .menu summary::-webkit-details-marker { display: none; }
    .menu-items { position: absolute; right: 0; z-index: 1; min-width: 200px; margin-top: 4px; padding: 4px 0; border-radius: 8px; background: var(--card); box-shadow: 0 4px 16px #0008; }
    .menu-items button { display: block; width: 100%; padding: 10px 16px; border: 0; background: none; color: var(--text); font: inherit; text-align: left; }
    .menu-items button.on { color: var(--accent); }
    #nota-history { margin: 16px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 13px; }
    #nota-history li { padding: 4px 0; }
    #ajustes { padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
    .exibicao { font-size: 12px; color: var(--accent); }
    #revelacao { margin: 8px 0 0; color: var(--accent); }
    #ajustes label { display: block; margin-top: 24px; font-weight: 600; }
    #ajustes select { display: block; width: 100%; margin-top: 8px; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    #ajustes .hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
    footer { position: sticky; bottom: 0; background: var(--bg); padding: 6px 16px max(8px, env(safe-area-inset-bottom)); font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <section id="setup" hidden>
    <h1>Preparando o catálogo</h1>
    <p id="setup-text">Baixando os filmes, só desta vez.</p>
    <progress id="progress"></progress>
    <button id="retry" hidden>Tentar de novo</button>
  </section>
  <div id="explorar" hidden>
    <header>
      <div>
        <h1>Explorar</h1>
        <div class="original">Para você</div>
      </div>
      <button id="import" class="pill">Importar do MovieLens</button>
      <button id="open-ajustes" class="pill">Ajustes</button>
      <input id="import-files" type="file" multiple hidden>
    </header>
    <p id="import-result" hidden></p>
    <main id="grid"></main>
    <button id="more" hidden>Mais filmes</button>
  </div>
  <section id="filme" hidden>
    <button id="back" class="pill">‹ Voltar</button>
    <div class="top">
      <div id="filme-poster"></div>
      <div>
        <h1 id="filme-title"></h1>
        <div id="filme-original" class="original"></div>
      </div>
    </div>
    <div id="acoes">
      <button class="pill" data-marca="QueroAssistir">Quero assistir</button>
      <button class="pill" data-marca="JaVi">Já vi</button>
      <details class="menu">
        <summary class="pill">⋯</summary>
        <div class="menu-items">
          <button data-marca="NaoMeInteressa">Não me interessa</button>
        </div>
      </details>
    </div>
    <div id="notas"></div>
    <p id="revelacao" hidden></p>
    <ul id="nota-history"></ul>
  </section>
  <section id="ajustes" hidden>
    <button class="pill back">‹ Voltar</button>
    <h1 style="margin-top: 12px">Ajustes</h1>
    <label for="decay">Notas antigas pesam menos</label>
    <select id="decay">
      <option value="Auto">Automático</option>
      <option value="Off">Não: todas pesam igual</option>
      <option value="90">Pela metade a cada 3 meses</option>
      <option value="180">Pela metade a cada 6 meses</option>
      <option value="365">Pela metade a cada ano</option>
      <option value="730">Pela metade a cada 2 anos</option>
      <option value="1460">Pela metade a cada 4 anos</option>
    </select>
    <div id="decay-hint" class="hint"></div>
    <label for="display-mode">Mostrar previsão como</label>
    <select id="display-mode">
      <option value="Faixa">Faixa (Aposta forte, Boa chance…)</option>
      <option value="Estrelas">Estrelas</option>
      <option value="Oculto">Oculto: só a ordem</option>
    </select>
  </section>
  <footer>Dados e imagens de filmes: TMDB. Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.</footer>
  <script>
    const { invoke, convertFileSrc } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const grid = document.getElementById('grid');
    const more = document.getElementById('more');
    let page = 0;

    function placeholder(m) {
      const el = document.createElement('div');
      el.className = 'poster missing';
      el.textContent = m.title;
      return el;
    }

    function posterOf(m) {
      let poster = placeholder(m);
      if (m.poster_url) {
        // Served from the on-device poster cache (see the `poster` protocol in src-tauri).
        poster = document.createElement('img');
        poster.className = 'poster';
        poster.src = convertFileSrc(m.poster_url.split('/').pop(), 'poster');
        poster.alt = m.title;
        poster.loading = 'lazy';
        poster.onerror = () => poster.replaceWith(placeholder(m));
      }
      return poster;
    }

    // Only in the chosen mode; the raw nota_prevista is never shown.
    function exibicaoText(p) {
      if (!p) return '';
      const confianca = `confiança ${Math.round(p.confianca * 100)}%`;
      if (p.modo === 'Faixa') return `${p.faixa} · ${confianca}`;
      const one = n => n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      return `★ ${one(p.nota)} (${one(p.meia_estrela)}) · ${confianca}`;
    }

    function card(m) {
      const el = document.createElement('article');
      el.className = 'movie';
      el.addEventListener('click', () => openMovie(m.tmdb_id));
      const poster = posterOf(m);
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = m.title;
      const original = document.createElement('div');
      original.className = 'original';
      original.textContent = m.year ? `${m.original_title} · ${m.year}` : m.original_title;
      el.append(poster, title, original);
      if (m.exibicao) {
        const exibicao = document.createElement('div');
        exibicao.className = 'exibicao';
        exibicao.textContent = exibicaoText(m.exibicao);
        el.append(exibicao);
      }
      return el;
    }

    // Recomendações change after every nota; the grid is rebuilt on the way back to it.
    let stale = false;

    async function load() {
      const result = await invoke('explorar', { page });
      grid.append(...result.movies.map(card));
      more.hidden = !result.has_more;
      page += 1;
    }

    async function setup() {
      const setupEl = document.getElementById('setup');
      const text = document.getElementById('setup-text');
      const progress = document.getElementById('progress');
      const retry = document.getElementById('retry');
      setupEl.hidden = false;
      retry.hidden = true;
      text.textContent = 'Baixando os filmes, só desta vez.';
      progress.removeAttribute('value');
      const stop = await listen('download-progress', ({ payload: [received, total] }) => {
        if (setupEl.hidden) return;
        const mb = (received / 1e6).toFixed(1);
        if (total) {
          progress.max = total;
          progress.value = received;
          text.textContent = `Baixando os filmes, só desta vez: ${mb} de ${(total / 1e6).toFixed(1)} MB`;
        } else {
          text.textContent = `Baixando os filmes, só desta vez: ${mb} MB`;
        }
      });
      try {
        await invoke('download_catalog');
        setupEl.hidden = true;
        start();
      } catch (e) {
        text.textContent = `Não deu para baixar o catálogo (${e}). Confira a internet.`;
        retry.hidden = false;
      } finally {
        stop();
      }
    }

    function reloadGrid() {
      page = 0;
      grid.replaceChildren();
      load();
    }

    const explorarEl = document.getElementById('explorar');
    const filmeEl = document.getElementById('filme');
    const notasEl = document.getElementById('notas');
    const fmt = n => n.toLocaleString('pt-BR', { minimumFractionDigits: 1 });
    for (let n = 0.5; n <= 5; n += 0.5) {
      const b = document.createElement('button');
      b.textContent = fmt(n);
      b.dataset.nota = n;
      notasEl.append(b);
    }

    function showMovie(m) {
      filmeEl.dataset.id = m.tmdb_id;
      document.getElementById('filme-poster').replaceChildren(posterOf(m));
      document.getElementById('filme-title').textContent = m.title;
      document.getElementById('filme-original').textContent = m.year ? `${m.original_title} · ${m.year}` : m.original_title;
      const marcas = { QueroAssistir: m.quero_assistir, JaVi: m.ja_vi, NaoMeInteressa: m.nao_me_interessa };
      for (const b of filmeEl.querySelectorAll('[data-marca]')) b.classList.toggle('on', marcas[b.dataset.marca]);
      for (const b of notasEl.children) b.classList.toggle('on', Number(b.dataset.nota) === m.nota);
      // Previous notas only; MovieLens's prediction stays hidden so it never anchors the nota.
      document.getElementById('nota-history').replaceChildren(...m.history.slice(0, -1).reverse().map(e => {
        const li = document.createElement('li');
        li.textContent = `Antes: ${fmt(e.nota)} em ${new Date(e.at * 1000).toLocaleDateString('pt-BR')}`;
        return li;
      }));
    }

    async function openMovie(id) {
      const m = await invoke('movie', { tmdbId: id });
      if (!m) return;
      // The rating screen never shows the prediction, so it cannot anchor the nota.
      document.getElementById('revelacao').hidden = true;
      showMovie(m);
      explorarEl.hidden = true;
      filmeEl.hidden = false;
      window.scrollTo(0, 0);
      // Lets Android's back gesture close the page.
      history.pushState({ filme: id }, '');
    }

    window.addEventListener('popstate', () => {
      filmeEl.hidden = true;
      ajustesEl.hidden = true;
      explorarEl.hidden = false;
      if (stale) {
        stale = false;
        reloadGrid();
      }
    });
    document.getElementById('back').addEventListener('click', () => history.back());

    const ajustesEl = document.getElementById('ajustes');
    const decayEl = document.getElementById('decay');
    const halfLife = d => !d ? 'nenhum peso a menos' : d < 365 ? `pela metade a cada ${d / 30} meses` : d === 365 ? 'pela metade a cada ano' : `pela metade a cada ${d / 365} anos`;
    function showDecay(s) {
      decayEl.value = typeof s.setting === 'string' ? s.setting : String(s.setting.HalfLifeDays);
      document.getElementById('decay-hint').textContent = s.setting === 'Auto'
        ? `Calibrado nas suas notas: ${halfLife(s.half_life_days)}.` : '';
    }
    const displayModeEl = document.getElementById('display-mode');
    displayModeEl.addEventListener('change', async () => {
      await invoke('set_display_mode', { mode: displayModeEl.value });
      stale = true;
    });
    document.getElementById('open-ajustes').addEventListener('click', async () => {
      showDecay(await invoke('decay'));
      displayModeEl.value = await invoke('display_mode');
      explorarEl.hidden = true;
      ajustesEl.hidden = false;
      history.pushState({ ajustes: true }, '');
    });
    ajustesEl.querySelector('.back').addEventListener('click', () => history.back());
    decayEl.addEventListener('change', async () => {
      const v = decayEl.value;
      showDecay(await invoke('set_decay', { decay: v === 'Auto' || v === 'Off' ? v : { HalfLifeDays: Number(v) } }));
      stale = true;
    });

    filmeEl.querySelectorAll('[data-marca]').forEach(b => b.addEventListener('click', async () => {
      const m = await invoke('marcar', { tmdbId: Number(filmeEl.dataset.id), marca: b.dataset.marca, on: !b.classList.contains('on') });
      filmeEl.querySelector('.menu').open = false;
      stale = true;
      if (m) showMovie(m);
    }));

    notasEl.addEventListener('click', async e => {
      const nota = Number(e.target.dataset.nota);
      if (!nota) return;
      const [m, revealed] = await invoke('rate', { tmdbId: Number(filmeEl.dataset.id), nota });
      stale = true;
      if (m) showMovie(m);
      const revelacao = document.getElementById('revelacao');
      revelacao.hidden = !revealed;
      if (revealed) revelacao.textContent = `O app achava: ${exibicaoText(revealed)}`;
    });

    const importFiles = document.getElementById('import-files');
    const importResult = document.getElementById('import-result');
    document.getElementById('import').addEventListener('click', () => importFiles.click());
    importFiles.addEventListener('change', async () => {
      const files = await Promise.all([...importFiles.files].map(f => f.text()));
      importFiles.value = '';
      if (!files.length) return;
      importResult.hidden = false;
      try {
        const s = await invoke('import_movielens', { files });
        reloadGrid();
        importResult.textContent = `Importadas ${s.notas} notas: ${s.matched} encontradas no catálogo, ${s.unmatched} não encontradas. ${s.quero_assistir} filmes em quero assistir.`;
      } catch (e) {
        importResult.textContent = `Não deu para importar (${e}). Escolha os arquivos de notas e de logs do export do MovieLens.`;
      }
    });

    // Explorar works in catálogo order until the model arrives; it is fetched in the
    // background, so the app never waits on it (and retries on the next launch if offline).
    async function start() {
      document.getElementById('explorar').hidden = false;
      load();
      const [, model] = await invoke('status');
      if (!model) invoke('download_model').then(reloadGrid, () => {});
    }

    more.addEventListener('click', load);
    document.getElementById('retry').addEventListener('click', setup);
    invoke('status').then(([catalog]) => catalog ? start() : setup());
  </script>
</body>
</html>
