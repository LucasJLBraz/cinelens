name: Catalog

# Builds the full catálogo from TMDB every day and publishes it as the asset
# `catalog.json.gz` of the release `catalog-v<format version>`, with `catalog-version.txt`
# (its data version): the app checks the version and downloads the catálogo when it changed.
# Séries go out the same way as `series.json.gz` and `series-version.txt`, which an app without
# séries never asks for, and animes as `animes.json.gz` and `animes-version.txt`.
# See docs/guides/tmdb.md and docs/guides/omdb.md.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Every movie in the training data enters the catálogo. MovieLens ml-latest is frozen,
      # so its TMDB ids are extracted once and kept in the cache.
      - uses: actions/cache@v4
        id: training-ids
        with:
          path: training-ids.txt
          key: training-ids-ml-latest-v1
      - name: Extract training data ids
        if: steps.training-ids.outputs.cache-hit != 'true'
        run: |
          # files.grouplens.org chains to emSign ECC Root CA - G3, which trust stores removed in
          # October 2026 after a security incident, so curl rejects it. ml-latest has not changed
          # since 2023: use the Internet Archive copy, checked against the hash of the GroupLens
          # file (its published MD5 matches). Back to GroupLens once its certificate is trusted.
          curl -fsSLo "$RUNNER_TEMP/ml-latest.zip" https://web.archive.org/web/20260101230406id_/https://files.grouplens.org/datasets/movielens/ml-latest.zip
          echo "66a9e518c747d76b241d9a859b001a2619d3ed1672ceef599eb50daf73a7b4a3  $RUNNER_TEMP/ml-latest.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/ml-latest.zip" ml-latest/links.csv | tail -n +2 | cut -d, -f3 > training-ids.txt

      # What OMDb said in earlier runs: its free key allows 1000 requests a day, so critics'
      # scores fill in over many runs. Caches are immutable, so each run saves a new one and
      # restores the latest.
      - uses: actions/cache/restore@v4
        with:
          path: omdb-cache.json
          key: omdb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: omdb-

      - name: Release tag
        run: |
          FORMAT=$(grep -oP 'CATALOG_FORMAT_VERSION: u32 = \K[0-9]+' core/src/lib.rs)
          echo "TAG=catalog-v$FORMAT" >> "$GITHUB_ENV"

      - name: Build catálogo
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          test -n "$TMDB_TOKEN" || { echo "::error::TMDB_TOKEN secret missing, see docs/guides/tmdb.md"; exit 1; }
          TODAY=$(date -u +%F)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          cargo run --release -p cinelens-catalog -- \
            --out catalog.json.gz \
            --today "$TODAY" \
            --recent-since "$(date -u -d '-180 days' +%F)" \
            --extra-ids training-ids.txt \
            --omdb-cache omdb-cache.json

      - uses: actions/cache/save@v4
        with:
          path: omdb-cache.json
          key: omdb-${{ github.run_id }}-${{ github.run_attempt }}

      # At most a quarter of the filmes' download: the job raises the vote cut until it fits and
      # records the count. Trouble here never holds back the filmes.
      - name: Build séries
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          cargo run --release -p cinelens-catalog -- \
            --series-up-to "$(( $(stat -c%s catalog.json.gz) / 4 ))" \
            --out series.json.gz \
            --today "$TODAY" \
            --recent-since "$(date -u -d '-180 days' +%F)"

      # At most a quarter more on the first download, filmes and séries together; same terms.
      - name: Build animes
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          SERIES=$(stat -c%s series.json.gz 2>/dev/null || echo 0)
          cargo run --release -p cinelens-catalog -- \
            --animes-up-to "$(( ($(stat -c%s catalog.json.gz) + SERIES) / 4 ))" \
            --out animes.json.gz \
            --today "$TODAY" \
            --recent-since "$(date -u -d '-180 days' +%F)"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORMAT=${TAG#catalog-v}
          NOTES="Catálogo completo, formato $FORMAT, dados de $TODAY. Baixado pelo app; não é uma versão do app."
          # Prerelease and never "latest", so Obtainium keeps tracking the app releases only.
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false --title "Catálogo (formato $FORMAT)" --notes "$NOTES"
          echo -n "$TODAY" > catalog-version.txt
          # The version last, so an app never sees it before the files it names.
          gh release upload "$TAG" catalog.json.gz --clobber
          gh release upload "$TAG" catalog-version.txt --clobber
          if [ -f series.json.gz ]; then
            echo -n "$TODAY" > series-version.txt
            gh release upload "$TAG" series.json.gz --clobber
            gh release upload "$TAG" series-version.txt --clobber
          fi
          if [ -f animes.json.gz ]; then
            echo -n "$TODAY" > animes-version.txt
            gh release upload "$TAG" animes.json.gz --clobber
            gh release upload "$TAG" animes-version.txt --clobber
          fi
          # Deltas older than 60 days: an app that far behind downloads the full catálogo.
          CUTOFF=$(date -u -d '-60 days' +%F)
          gh release view "$TAG" --json assets --jq '.assets[].name' | { grep -oP '^catalog-delta-\K[0-9-]+(?=\.json\.gz$)' || true; } | while read -r FROM; do
            if [[ "$FROM" < "$CUTOFF" ]]; then gh release delete-asset "$TAG" "catalog-delta-$FROM.json.gz" -y; fi
          done
          gh release edit "$TAG" --notes "$NOTES"
