name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cinelens-core -p cinelens-catalog -p cinelens-train
      # Speed budgets (design §8): exits non-zero when one is exceeded.
      - run: cargo bench -p cinelens-core
