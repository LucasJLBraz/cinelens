name: Model

# Trains the movie factors on MovieLens ml-latest plus the Letterboxd April 2026 sample every
# month and publishes the asset
# `model.json.gz` of the release `model-v<format version>`, which the app downloads when
# `model-version.txt` names a version it has not seen, plus a
# dated copy `model-<date>.json.gz` that stays as the history. Only public data: the owner's
# notas never reach CI, the app folds them in on-device. Letterboxd comes from Kaggle with the
# KAGGLE_API_TOKEN secret (docs/guides/kaggle.md) and is joined through the catálogo's IMDb ids;
# without the secret the model is trained on MovieLens alone (ADR 0002: Letterboxd stays only
# while it does not worsen the MAE on the owner's notas).
on:
  schedule:
    - cron: "41 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download ml-latest
        run: |
          # files.grouplens.org chains to emSign ECC Root CA - G3, which trust stores removed in
          # October 2026 after a security incident, so curl rejects it. ml-latest has not changed
          # since 2023: use the Internet Archive copy, checked against the hash of the GroupLens
          # file (its published MD5 matches). Back to GroupLens once its certificate is trusted.
          curl -fsSLo "$RUNNER_TEMP/ml-latest.zip" https://web.archive.org/web/20260101230406id_/https://files.grouplens.org/datasets/movielens/ml-latest.zip
          echo "66a9e518c747d76b241d9a859b001a2619d3ed1672ceef599eb50daf73a7b4a3  $RUNNER_TEMP/ml-latest.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/ml-latest.zip" ml-latest/ratings.csv ml-latest/links.csv ml-latest/genome-tags.csv ml-latest/genome-scores.csv

      - name: Download Letterboxd sample
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::warning::KAGGLE_API_TOKEN secret missing, training on MovieLens alone; see docs/guides/kaggle.md"
            exit 0
          fi
          echo "LETTERBOXD=1" >> "$GITHUB_ENV"
          pip install --quiet kaggle==2.2.5
          kaggle datasets download tliocastro/letterboxd-sample-apr-2026 -f letterboxd_interactions.csv -p "$RUNNER_TEMP"
          # Kaggle may hand the file over zipped.
          if [ -f "$RUNNER_TEMP/letterboxd_interactions.csv.zip" ]; then
            unzip -q -o -d "$RUNNER_TEMP" "$RUNNER_TEMP/letterboxd_interactions.csv.zip"
          fi
          test -s "$RUNNER_TEMP/letterboxd_interactions.csv"

      # The content mapping is learned from the catálogo's genres, directors and cast, and
      # Letterboxd movies are joined to TMDB ids through its IMDb ids.
      - name: Download catálogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORMAT=$(grep -oP 'CATALOG_FORMAT_VERSION: u32 = \K[0-9]+' core/src/lib.rs)
          if gh release download "catalog-v$FORMAT" -p catalog.json.gz -D "$RUNNER_TEMP"; then
            echo "CATALOG=1" >> "$GITHUB_ENV"
          elif [ "$LETTERBOXD" = 1 ]; then
            echo "::error::no published catálogo to join Letterboxd with; run the Catalog workflow first"
            exit 1
          else
            echo "::warning::no published catálogo: the model has no content mapping"
          fi

      - name: Train
        run: |
          TODAY=$(date -u +%F)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          EXTRA=()
          if [ "$CATALOG" = 1 ]; then
            EXTRA+=(--catalog "$RUNNER_TEMP/catalog.json.gz")
          fi
          if [ "$LETTERBOXD" = 1 ]; then
            EXTRA+=(--letterboxd "$RUNNER_TEMP/letterboxd_interactions.csv")
          fi
          cargo run --release -p cinelens-train -- \
            --ratings "$RUNNER_TEMP/ml-latest/ratings.csv" \
            --links "$RUNNER_TEMP/ml-latest/links.csv" \
            --genome-tags "$RUNNER_TEMP/ml-latest/genome-tags.csv" \
            --genome-scores "$RUNNER_TEMP/ml-latest/genome-scores.csv" \
            "${EXTRA[@]}" \
            --out model.json.gz \
            --data-version "$TODAY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORMAT=$(grep -oP 'MODEL_FORMAT_VERSION: u32 = \K[0-9]+' core/src/recommender.rs)
          TAG="model-v$FORMAT"
          LETTERBOXD_NOTES=""
          if [ "$LETTERBOXD" = 1 ]; then
            LETTERBOXD_NOTES="Treinado também no Letterboxd Movie Interaction Dataset (Letterboxd-Sample-Apr-2026, de Túlio Castro, https://www.kaggle.com/datasets/tliocastro/letterboxd-sample-apr-2026), licenciado sob CC BY-NC-SA 4.0 (https://creativecommons.org/licenses/by-nc-sa/4.0/). Este modelo é uma adaptação desse conjunto e é distribuído sob a mesma licença CC BY-NC-SA 4.0: atribuição, uso não comercial, compartilhamento pela mesma licença."
          fi
          cat > notes.md <<NOTES
          Modelo de recomendação (fatores dos filmes), formato $FORMAT, treinado em $TODAY. Baixado pelo app; não é uma versão do app.

          Treinado no conjunto de dados MovieLens \`ml-latest\` do GroupLens Research (https://grouplens.org/datasets/movielens/), usado sob os termos do GroupLens: uso em pesquisa e não comercial, transformações redistribuídas sob os mesmos termos, sem endosso da Universidade de Minnesota nem do GroupLens. Este modelo herda esses termos.

          $LETTERBOXD_NOTES

          Citação: F. Maxwell Harper and Joseph A. Konstan. 2015. The MovieLens Datasets: History and Context. ACM Transactions on Interactive Intelligent Systems (TiiS) 5, 4: 19:1–19:19. https://doi.org/10.1145/2827872
          NOTES
          # Prerelease and never "latest", so Obtainium keeps tracking the app releases only.
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false --title "Modelo (formato $FORMAT)" --notes-file notes.md
          cp model.json.gz "model-$TODAY.json.gz"
          gh release upload "$TAG" model.json.gz "model-$TODAY.json.gz" --clobber
          # What the app checks for a new model; uploaded last, after the files it names.
          echo -n "$TODAY" > model-version.txt
          gh release upload "$TAG" model-version.txt --clobber
          gh release edit "$TAG" --notes-file notes.md
